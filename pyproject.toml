[project]
name = "meetingsgpt"
version = "0.2.0"
description = "Transcribe y resume vídeos de reuniones con Whisper + GPT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "openai>=2.3.0",
    "pydantic>=2.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tiktoken>=0.7.0",
    "typer>=0.15.0",
]

[project.scripts]
meetingsgpt = "meetingsgpt.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
